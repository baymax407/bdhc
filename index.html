<script>
const PRACTICALS = [{"id": "1", "file": "pract-1-BD.md", "title": "1. Install configure and run Hadoop and HDFS and Explore HDFS", "text": "# Big Data Practical\n\n**Date:** 03/10/2026\n\n**Practical:** 1. Install configure and run Hadoop and HDFS and Explore HDFS\n\n---\n\n## 1. Aim\n\nTo install, configure and run Hadoop and HDFS, explore HDFS commands and implement a Word Count MapReduce program using Hadoop Streaming with Python.\n\n## 2. Objective\n\n1. Open terminal in Cloudera QuickStart VM and verify Hadoop installation.\n2. Create Python Mapper and Reducer scripts for Word Count.\n3. Create a sample input file and test the program locally.\n4. Explore HDFS — create directory, upload file and verify with `hdfs dfs` commands.\n5. Run the MapReduce Streaming job on Hadoop and view the output from HDFS.\n\n## 7. Conclusion\n\nHadoop and HDFS were successfully installed, configured and explored using `hdfs dfs` commands. The Python MapReduce Word Count job (mapper + reducer) was tested locally and then executed successfully on Hadoop Streaming, with the correct word frequencies retrieved from HDFS output.", "dataset": "hello world\nhello hadoop\nhadoop is easy\n", "code": "# --- bash ---\nhadoop version\n\n# --- bash ---\nnano input.txt\n\n# --- bash ---\nhdfs dfs -mkdir -p /wordcount/input\n   hdfs dfs -put input.txt /wordcount/input/\n   hdfs dfs -ls /wordcount/input\n\n# --- python ---\n#!/usr/bin/env python\nimport sys\n\nfor line in sys.stdin:\n    # Remove leading and trailing whitespace and split into words\n    words = line.strip().split()\n    \n    # Emit key-value pairs (word, 1) separated by a tab\n    for word in words:\n        print \"%s\\t1\" % word\n\n# --- python ---\n#!/usr/bin/env python\nimport sys\n\ncurrent_word = None\ncurrent_count = 0\n\nfor line in sys.stdin:\n    line = line.strip()\n    if not line:\n        continue\n\n    # Parse key and value from mapper\n    word, count = line.split(\"\\t\")\n    count = int(count)\n\n    # Aggregate counts for the same word\n    if current_word == word:\n        current_count += count\n    else:\n        if current_word is not None:\n            # Emit aggregated key-value pair\n            print \"%s\\t%d\" % (current_word, current_count)\n\n        current_word = word\n        current_count = count\n\n# Emit the last word\nif current_word is not None:\n    print \"%s\\t%d\" % (current_word, current_count)\n\n# --- bash ---\ncat input.txt | python mapper.py | sort | python reducer.py\n\n# --- bash ---\nhdfs dfs -rm -r /wordcount/output\n\n   hadoop jar /usr/lib/hadoop-mapreduce/hadoop-streaming.jar \\\n     -input /wordcount/input \\\n     -output /wordcount/output \\\n     -mapper \"python mapper.py\" \\\n     -reducer \"python reducer.py\" \\\n     -file mapper.py \\\n     -file reducer.py\n\n# --- bash ---\nhdfs dfs -cat /wordcount/output/part-00000\n\n# --- bash ---\ncat input.txt | python mapper.py | sort | python reducer.py\n\n# --- bash ---\nhdfs dfs -cat /wordcount/output/part-00000", "full": "# Big Data Practical\n\n**Date:** 03/10/2026\n\n**Practical:** 1. Install configure and run Hadoop and HDFS and Explore HDFS\n\n---\n\n## 1. Aim\n\nTo install, configure and run Hadoop and HDFS, explore HDFS commands and implement a Word Count MapReduce program using Hadoop Streaming with Python.\n\n## 2. Objective\n\n1. Open terminal in Cloudera QuickStart VM and verify Hadoop installation.\n2. Create Python Mapper and Reducer scripts for Word Count.\n3. Create a sample input file and test the program locally.\n4. Explore HDFS — create directory, upload file and verify with `hdfs dfs` commands.\n5. Run the MapReduce Streaming job on Hadoop and view the output from HDFS.\n\n## 3. PIP Statement / Prerequisites\n\nNo `pip` package is required for this practical.\n\n**Required setup:**\n\n- Cloudera QuickStart VM\n- Hadoop (e.g. Hadoop 2.6.0-cdh — verify with `hadoop version`)\n- HDFS running\n- System Python in Cloudera VM (Python 2.6/2.7 — hence `%` formatting is used, not f-strings)\n- Streaming jar: `/usr/lib/hadoop-mapreduce/hadoop-streaming.jar`\n\n**Verification:**\n\n```bash\nhadoop version\n```\n\n## 4. Dataset / File Setup\n\n**Files used (local Linux filesystem in VM):**\n\n```\n~/wordcount/\n├── mapper.py\n├── reducer.py\n└── input.txt\n```\n\n**HDFS paths used:**\n\n```\n/wordcount/input/   -> input file uploaded here\n/wordcount/output/  -> MapReduce output directory (part-00000)\n```\n\n**Input dataset (`input.txt`):**\n\n```text\nhello world\nhello hadoop\nhadoop is easy\n```\n\n**Setup steps:**\n\n1. Create the scripts `mapper.py` and `reducer.py` using `nano` (see Section 5).\n2. Create `input.txt` with the above 3 lines:\n   ```bash\n   nano input.txt\n   ```\n3. Create HDFS input directory and upload file:\n   ```bash\n   hdfs dfs -mkdir -p /wordcount/input\n   hdfs dfs -put input.txt /wordcount/input/\n   hdfs dfs -ls /wordcount/input\n   ```\n\n## 5. Python Program\n\n### File Name: `mapper.py`\n\nCreate with `nano mapper.py`:\n\n```python\n#!/usr/bin/env python\nimport sys\n\nfor line in sys.stdin:\n    # Remove leading and trailing whitespace and split into words\n    words = line.strip().split()\n    \n    # Emit key-value pairs (word, 1) separated by a tab\n    for word in words:\n        print \"%s\\t1\" % word\n```\n\n### File Name: `reducer.py`\n\nCreate with `nano reducer.py`:\n\n```python\n#!/usr/bin/env python\nimport sys\n\ncurrent_word = None\ncurrent_count = 0\n\nfor line in sys.stdin:\n    line = line.strip()\n    if not line:\n        continue\n\n    # Parse key and value from mapper\n    word, count = line.split(\"\\t\")\n    count = int(count)\n\n    # Aggregate counts for the same word\n    if current_word == word:\n        current_count += count\n    else:\n        if current_word is not None:\n            # Emit aggregated key-value pair\n            print \"%s\\t%d\" % (current_word, current_count)\n\n        current_word = word\n        current_count = count\n\n# Emit the last word\nif current_word is not None:\n    print \"%s\\t%d\" % (current_word, current_count)\n```\n\n**How to run:**\n\n1. Test locally (before Hadoop):\n   ```bash\n   cat input.txt | python mapper.py | sort | python reducer.py\n   ```\n\n2. Run Hadoop Streaming job:\n   ```bash\n   hdfs dfs -rm -r /wordcount/output\n\n   hadoop jar /usr/lib/hadoop-mapreduce/hadoop-streaming.jar \\\n     -input /wordcount/input \\\n     -output /wordcount/output \\\n     -mapper \"python mapper.py\" \\\n     -reducer \"python reducer.py\" \\\n     -file mapper.py \\\n     -file reducer.py\n   ```\n\n3. View result from HDFS:\n   ```bash\n   hdfs dfs -cat /wordcount/output/part-00000\n   ```\n\n## 6. Output\n\n**Local test output:**\n\n```bash\ncat input.txt | python mapper.py | sort | python reducer.py\n```\n\n```text\neasy\t1\nhadoop\t2\nhello\t2\nis\t1\nworld\t1\n```\n\n**HDFS output:**\n\n```bash\nhdfs dfs -cat /wordcount/output/part-00000\n```\n\n```text\neasy\t1\nhadoop\t2\nhello\t2\nis\t1\nworld\t1\n```\n\n## 7. Conclusion\n\nHadoop and HDFS were successfully installed, configured and explored using `hdfs dfs` commands. The Python MapReduce Word Count job (mapper + reducer) was tested locally and then executed successfully on Hadoop Streaming, with the correct word frequencies retrieved from HDFS output."}, {"id": "2", "file": "pract-2-BD.md", "title": "2. Implement Word Count / Frequency programs using MapReduce", "text": "# Big Data Practical\n\n**Date:** 04/10/2026\n\n**Practical:** 2. Implement Word Count / Frequency programs using MapReduce\n\n---\n\n## 1. Aim\n\nTo implement Word Count / Word Frequency programs using the MapReduce paradigm with Python (Mapper + Reducer) and execute it via Hadoop Streaming.\n\n## 2. Objective\n\n1. Understand MapReduce phases for Word Count — Map, Shuffle and Sort, Reduce.\n2. Create Python Mapper to emit `(word, 1)` for each word.\n3. Create Python Reducer to sum frequencies per word.\n4. Test the program locally and run it as a Hadoop Streaming job.\n\n## 7. Conclusion\n\nThe Word Count / Word Frequency program was successfully implemented using MapReduce. The mapper emitted `(word, 1)`, shuffling grouped identical words, and the reducer summed the counts to give correct frequencies. The same logic executed locally and on Hadoop Streaming, thus satisfying Practical 2 requirements. Practical 1 (Hadoop/HDFS setup) provides the platform, while this practical demonstrates the core MapReduce frequency computation.", "dataset": "hello world\nhello hadoop\nhadoop is easy\n", "code": "# --- bash ---\nhadoop version\n\n# --- bash ---\nnano input.txt\n\n# --- bash ---\nhdfs dfs -mkdir -p /wordcount/input\n   hdfs dfs -put input.txt /wordcount/input/\n   hdfs dfs -ls /wordcount/input\n\n# --- python ---\n#!/usr/bin/env python\nimport sys\n\nfor line in sys.stdin:\n    # Remove leading and trailing whitespace and split into words\n    words = line.strip().split()\n\n    # Emit key-value pairs (word, 1) separated by a tab\n    for word in words:\n        print \"%s\\t1\" % word\n\n# --- python ---\n#!/usr/bin/env python\nimport sys\n\ncurrent_word = None\ncurrent_count = 0\n\nfor line in sys.stdin:\n    line = line.strip()\n    if not line:\n        continue\n\n    # Parse key and value from mapper\n    word, count = line.split(\"\\t\")\n    count = int(count)\n\n    # Aggregate counts for the same word (word frequency)\n    if current_word == word:\n        current_count += count\n    else:\n        if current_word is not None:\n            # Emit word with its total frequency\n            print \"%s\\t%d\" % (current_word, current_count)\n\n        current_word = word\n        current_count = count\n\n# Emit the last word\nif current_word is not None:\n    print \"%s\\t%d\" % (current_word, current_count)\n\n# --- bash ---\ncat input.txt | python mapper.py | sort | python reducer.py\n\n# --- bash ---\nhdfs dfs -rm -r /wordcount/output\n\n   hadoop jar /usr/lib/hadoop-mapreduce/hadoop-streaming.jar \\\n     -input /wordcount/input \\\n     -output /wordcount/output \\\n     -mapper \"python mapper.py\" \\\n     -reducer \"python reducer.py\" \\\n     -file mapper.py \\\n     -file reducer.py\n\n# --- bash ---\nhdfs dfs -cat /wordcount/output/part-00000\n\n# --- bash ---\ncat input.txt | python mapper.py | sort | python reducer.py\n\n# --- bash ---\nhdfs dfs -cat /wordcount/output/part-00000", "full": "# Big Data Practical\n\n**Date:** 04/10/2026\n\n**Practical:** 2. Implement Word Count / Frequency programs using MapReduce\n\n---\n\n## 1. Aim\n\nTo implement Word Count / Word Frequency programs using the MapReduce paradigm with Python (Mapper + Reducer) and execute it via Hadoop Streaming.\n\n## 2. Objective\n\n1. Understand MapReduce phases for Word Count — Map, Shuffle and Sort, Reduce.\n2. Create Python Mapper to emit `(word, 1)` for each word.\n3. Create Python Reducer to sum frequencies per word.\n4. Test the program locally and run it as a Hadoop Streaming job.\n\n## 3. PIP Statement / Prerequisites\n\nNo `pip` package is required for this practical.\n\n**Required setup:**\n\n- Cloudera QuickStart VM\n- Hadoop (e.g. Hadoop 2.6.0-cdh — verify with `hadoop version`)\n- HDFS running\n- System Python in Cloudera VM (Python 2.6/2.7 — hence `%` formatting is used, not f-strings)\n- Streaming jar: `/usr/lib/hadoop-mapreduce/hadoop-streaming.jar`\n\n**Verification:**\n\n```bash\nhadoop version\n```\n\n## 4. Dataset / File Setup\n\n**Files used (local Linux filesystem in VM):**\n\n```\n~/wordcount/\n├── mapper.py\n├── reducer.py\n└── input.txt\n```\n\n**HDFS paths used (same as Practical 1):**\n\n```\n/wordcount/input/   -> input file uploaded here\n/wordcount/output/  -> MapReduce output directory (part-00000)\n```\n\n**Input dataset (`input.txt`):**\n\n```text\nhello world\nhello hadoop\nhadoop is easy\n```\n\nWord frequency in this dataset: `hello: 2, hadoop: 2, world: 1, is: 1, easy: 1` — Total words = 7.\n\n**Setup steps:**\n\n1. Create the scripts `mapper.py` and `reducer.py` using `nano` (see Section 5).\n2. Create `input.txt` with the above 3 lines:\n   ```bash\n   nano input.txt\n   ```\n3. For Hadoop run, upload to HDFS:\n   ```bash\n   hdfs dfs -mkdir -p /wordcount/input\n   hdfs dfs -put input.txt /wordcount/input/\n   hdfs dfs -ls /wordcount/input\n   ```\n\n## 5. Python Program\n\n### File Name: `mapper.py`\n\nCreate with `nano mapper.py`:\n\n```python\n#!/usr/bin/env python\nimport sys\n\nfor line in sys.stdin:\n    # Remove leading and trailing whitespace and split into words\n    words = line.strip().split()\n\n    # Emit key-value pairs (word, 1) separated by a tab\n    for word in words:\n        print \"%s\\t1\" % word\n```\n\n### File Name: `reducer.py`\n\nCreate with `nano reducer.py`:\n\n```python\n#!/usr/bin/env python\nimport sys\n\ncurrent_word = None\ncurrent_count = 0\n\nfor line in sys.stdin:\n    line = line.strip()\n    if not line:\n        continue\n\n    # Parse key and value from mapper\n    word, count = line.split(\"\\t\")\n    count = int(count)\n\n    # Aggregate counts for the same word (word frequency)\n    if current_word == word:\n        current_count += count\n    else:\n        if current_word is not None:\n            # Emit word with its total frequency\n            print \"%s\\t%d\" % (current_word, current_count)\n\n        current_word = word\n        current_count = count\n\n# Emit the last word\nif current_word is not None:\n    print \"%s\\t%d\" % (current_word, current_count)\n```\n\n**How to run:**\n\n1. Test locally (before Hadoop):\n   ```bash\n   cat input.txt | python mapper.py | sort | python reducer.py\n   ```\n\n2. Run Hadoop Streaming job:\n   ```bash\n   hdfs dfs -rm -r /wordcount/output\n\n   hadoop jar /usr/lib/hadoop-mapreduce/hadoop-streaming.jar \\\n     -input /wordcount/input \\\n     -output /wordcount/output \\\n     -mapper \"python mapper.py\" \\\n     -reducer \"python reducer.py\" \\\n     -file mapper.py \\\n     -file reducer.py\n   ```\n\n3. View result from HDFS:\n   ```bash\n   hdfs dfs -cat /wordcount/output/part-00000\n   ```\n\n## 6. Output\n\n**Local test output:**\n\n```bash\ncat input.txt | python mapper.py | sort | python reducer.py\n```\n\n```text\neasy\t1\nhadoop\t2\nhello\t2\nis\t1\nworld\t1\n```\n\n**HDFS output:**\n\n```bash\nhdfs dfs -cat /wordcount/output/part-00000\n```\n\n```text\neasy\t1\nhadoop\t2\nhello\t2\nis\t1\nworld\t1\n```\n\nFrequency interpretation: `hadoop` appears 2 times, `hello` appears 2 times, all other words appear once. Total distinct words = 5, total words = 7.\n\n## 7. Conclusion\n\nThe Word Count / Word Frequency program was successfully implemented using MapReduce. The mapper emitted `(word, 1)`, shuffling grouped identical words, and the reducer summed the counts to give correct frequencies. The same logic executed locally and on Hadoop Streaming, thus satisfying Practical 2 requirements. Practical 1 (Hadoop/HDFS setup) provides the platform, while this practical demonstrates the core MapReduce frequency computation."}, {"id": "3-A", "file": "pract-3-A-BD.md", "title": "3-A. Implement a MapReduce program to process the Weather Dataset", "text": "# Big Data Practical\n\n**Date:** 12/10/2026\n\n**Practical:** 3-A. Implement a MapReduce program to process the Weather Dataset\n\n---\n\n## 1. Aim\n\nTo implement a MapReduce program in Python to process the Weather Dataset and find the maximum temperature recorded per weather station.\n\n## 2. Objective\n\nUnderstand the three phases of MapReduce:\n\n1. **Mapper** — Emit `(station, temperature)` for each record.\n2. **Shuffle and Sort** — Group all temperatures by station.\n3. **Reducer** — Compute `max(temperatures)` per station.\n\n## 7. Conclusion\n\nThe MapReduce logic was successfully implemented in Python. The mapper emitted 20 `(station, temperature)` pairs, the shuffle phase grouped them into 3 keys (ST01, ST02, ST03), and the reducer correctly computed the maximum temperature per station. The program demonstrates how large weather datasets can be processed in parallel using the MapReduce paradigm.", "dataset": "Station,Date,Temperature\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST03,2026-01-01,25\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,999\n", "code": "# --- bash ---\npython --version\n# Python 3.14.6 (verified on lab machine)\n\n# No pip install needed for this practical.\n# Used modules: csv, collections.defaultdict (both come with Python)\n\n# --- python ---\n# Big Data Practical - 11/10/2026\n# Practical 3 : Implement an MapReduce program to process the Weather Dataset\n\nimport csv \nfrom collections import defaultdict\n\n\n# weather_mapper.py\n\n# Mapper: Emit (station, temperature)\ndef mapper(filename):\n    mapped_data = []\n\n    with open(filename, \"r\", newline=\"\") as file:\n        reader = csv.DictReader(file)\n\n        for row in reader:\n            station = row[\"Station\"]\n            temperature = float(row[\"Temperature\"])\n\n            mapped_data.append((station, temperature))\n\n    return mapped_data\n\n\n# Shuffle and Sort: Group values by station\ndef shuffle_and_sort(mapped_data):\n    grouped_data = defaultdict(list)\n\n    for station, temperature in mapped_data:\n        grouped_data[station].append(temperature)\n\n    return grouped_data\n\n\n# Reducer: Find maximum temperature per station\ndef reducer(grouped_data):\n    results = {}\n\n    for station, temperatures in grouped_data.items():\n        results[station] = max(temperatures)\n\n    return results\n\n\n# Main program\nif __name__ == \"__main__\":\n    filename = \"weather.csv\"\n\n    # Step 1: Map\n    mapped_data = mapper(filename)\n    print(\"MAPPER OUTPUT:\")\n    for item in mapped_data:\n        print(item)\n\n    # Step 2: Shuffle and Sort\n    grouped_data = shuffle_and_sort(mapped_data)\n    print(\"\\nSHUFFLE AND SORT OUTPUT:\")\n    for station, temperatures in sorted(grouped_data.items()):\n        print(station, temperatures)\n\n    # Step 3: Reduce\n    results = reducer(grouped_data)\n    print(\"\\nREDUCER OUTPUT (Maximum Temperature):\")\n    for station, temperature in sorted(results.items()):\n        print(f\"{station}: {temperature:.1f} C\")\n\n# --- bash ---\ncd \"Big Data\"\npython pract-3-BD.py", "full": "# Big Data Practical\n\n**Date:** 12/10/2026\n\n**Practical:** 3-A. Implement a MapReduce program to process the Weather Dataset\n\n---\n\n## 1. Aim\n\nTo implement a MapReduce program in Python to process the Weather Dataset and find the maximum temperature recorded per weather station.\n\n## 2. Objective\n\nUnderstand the three phases of MapReduce:\n\n1. **Mapper** — Emit `(station, temperature)` for each record.\n2. **Shuffle and Sort** — Group all temperatures by station.\n3. **Reducer** — Compute `max(temperatures)` per station.\n\n## 3. PIP Statement / Prerequisites\n\nNo external package is required. Only Python standard library modules are used.\n\n```bash\npython --version\n# Python 3.14.6 (verified on lab machine)\n\n# No pip install needed for this practical.\n# Used modules: csv, collections.defaultdict (both come with Python)\n```\n\n## 4. Dataset / File Setup\n\n**File:** `weather.csv`\n**Location:** Same folder as the Python program, i.e.:\n\n```\nBig Data/\n├── pract-3-BD.py\n└── weather.csv\n```\n\n**Dataset content (`weather.csv`):**\n\n```csv\nStation,Date,Temperature\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST03,2026-01-01,25\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,999\n```\n\n**Schema:**\n\n| Column | Description | Example |\n|---|---|---|\n| Station | Weather station ID | ST01, ST02, ST03 |\n| Date | Observation date (YYYY-MM-DD) | 2026-01-01 |\n| Temperature | Temperature in Celsius | 32, 28, 999 |\n\n> Note: The last row `ST01,2026-01-03,999` is an outlier / extreme value to test the max logic. The reducer correctly reports `ST01: 999.0 C`.\n\n**Setup steps:**\n\n1. Create folder `Big Data`.\n2. Save dataset as `weather.csv` in that folder.\n3. Save program as `pract-3-BD.py` in the same folder.\n4. Run: `python pract-3-BD.py`\n\n## 5. Python Program\n\n**File Name:** `pract-3-BD.py`\n\n```python\n# Big Data Practical - 11/10/2026\n# Practical 3 : Implement an MapReduce program to process the Weather Dataset\n\nimport csv \nfrom collections import defaultdict\n\n# weather_mapper.py\n\n# Mapper: Emit (station, temperature)\ndef mapper(filename):\n    mapped_data = []\n\n    with open(filename, \"r\", newline=\"\") as file:\n        reader = csv.DictReader(file)\n\n        for row in reader:\n            station = row[\"Station\"]\n            temperature = float(row[\"Temperature\"])\n\n            mapped_data.append((station, temperature))\n\n    return mapped_data\n\n# Shuffle and Sort: Group values by station\ndef shuffle_and_sort(mapped_data):\n    grouped_data = defaultdict(list)\n\n    for station, temperature in mapped_data:\n        grouped_data[station].append(temperature)\n\n    return grouped_data\n\n# Reducer: Find maximum temperature per station\ndef reducer(grouped_data):\n    results = {}\n\n    for station, temperatures in grouped_data.items():\n        results[station] = max(temperatures)\n\n    return results\n\n# Main program\nif __name__ == \"__main__\":\n    filename = \"weather.csv\"\n\n    # Step 1: Map\n    mapped_data = mapper(filename)\n    print(\"MAPPER OUTPUT:\")\n    for item in mapped_data:\n        print(item)\n\n    # Step 2: Shuffle and Sort\n    grouped_data = shuffle_and_sort(mapped_data)\n    print(\"\\nSHUFFLE AND SORT OUTPUT:\")\n    for station, temperatures in sorted(grouped_data.items()):\n        print(station, temperatures)\n\n    # Step 3: Reduce\n    results = reducer(grouped_data)\n    print(\"\\nREDUCER OUTPUT (Maximum Temperature):\")\n    for station, temperature in sorted(results.items()):\n        print(f\"{station}: {temperature:.1f} C\")\n```\n\n**How to run:**\n\n```bash\ncd \"Big Data\"\npython pract-3-BD.py\n```\n\n## 6. Output\n\nReal output captured on Python 3.14.6:\n\n```text\nMAPPER OUTPUT:\n('ST01', 32.0)\n('ST02', 28.0)\n('ST01', 35.0)\n('ST02', 31.0)\n('ST01', 30.0)\n('ST03', 25.0)\n('ST02', 29.0)\n('ST03', 27.0)\n('ST01', 32.0)\n('ST02', 28.0)\n('ST01', 35.0)\n('ST02', 31.0)\n('ST01', 30.0)\n('ST02', 29.0)\n('ST03', 27.0)\n('ST01', 32.0)\n('ST02', 28.0)\n('ST01', 35.0)\n('ST02', 31.0)\n('ST01', 999.0)\n\nSHUFFLE AND SORT OUTPUT:\nST01 [32.0, 35.0, 30.0, 32.0, 35.0, 30.0, 32.0, 35.0, 999.0]\nST02 [28.0, 31.0, 29.0, 28.0, 31.0, 29.0, 28.0, 31.0]\nST03 [25.0, 27.0, 27.0]\n\nREDUCER OUTPUT (Maximum Temperature):\nST01: 999.0 C\nST02: 31.0 C\nST03: 27.0 C\n```\n\n## 7. Conclusion\n\nThe MapReduce logic was successfully implemented in Python. The mapper emitted 20 `(station, temperature)` pairs, the shuffle phase grouped them into 3 keys (ST01, ST02, ST03), and the reducer correctly computed the maximum temperature per station. The program demonstrates how large weather datasets can be processed in parallel using the MapReduce paradigm."}, {"id": "3-B", "file": "pract-3-B-BD.md", "title": "3-B. Implement a MapReduce program to find Date wise Maximum Temperature from the Weather Dataset", "text": "# Big Data Practical\n\n**Date:** 12/10/2026\n\n**Practical:** 3-B. Implement a MapReduce program to find Date wise Maximum Temperature from the Weather Dataset\n\n---\n\n## 1. Aim\n\nTo modify the Practical 3 MapReduce program to process the Weather Dataset and find the maximum temperature recorded per date (instead of per station).\n\n## 2. Objective\n\nUnderstand the three phases of MapReduce applied on the date key:\n\n1. **Mapper** — Emit `(date, temperature)` for each record.\n2. **Shuffle and Sort** — Group all temperatures by date.\n3. **Reducer** — Compute `max(temperatures)` per date.\n\n## 7. Conclusion\n\nThe MapReduce logic was successfully modified to use date as the key. The mapper emitted 20 `(date, temperature)` pairs, the shuffle phase grouped them into 3 keys (2026-01-01, 2026-01-02, 2026-01-03), and the reducer correctly computed the maximum temperature per date. This demonstrates how the same MapReduce pattern can answer different analytical queries by simply changing the key.", "dataset": "Station,Date,Temperature\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST03,2026-01-01,25\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,999\n", "code": "# --- bash ---\npython --version\n# Python 3.14.6 (verified on lab machine)\n\n# No pip install needed for this practical.\n# Used modules: csv, collections.defaultdict (both come with Python)\n\n# --- python ---\n# Big Data Practical - 12/10/2026\n# Practical 3-B : MapReduce program to find Date wise Maximum Temperature\n\nimport csv\nfrom collections import defaultdict\n\n\n# Mapper: Emit (date, temperature)\ndef mapper(filename):\n    mapped_data = []\n\n    with open(filename, \"r\", newline=\"\") as file:\n        reader = csv.DictReader(file)\n\n        for row in reader:\n            date = row[\"Date\"]\n            temperature = float(row[\"Temperature\"])\n\n            mapped_data.append((date, temperature))\n\n    return mapped_data\n\n\n# Shuffle and Sort: Group values by date\ndef shuffle_and_sort(mapped_data):\n    grouped_data = defaultdict(list)\n\n    for date, temperature in mapped_data:\n        grouped_data[date].append(temperature)\n\n    return grouped_data\n\n\n# Reducer: Find maximum temperature per date\ndef reducer(grouped_data):\n    results = {}\n\n    for date, temperatures in grouped_data.items():\n        results[date] = max(temperatures)\n\n    return results\n\n\n# Main program\nif __name__ == \"__main__\":\n    filename = \"weather.csv\"\n\n    # Step 1: Map\n    mapped_data = mapper(filename)\n    print(\"MAPPER OUTPUT:\")\n    for item in mapped_data:\n        print(item)\n\n    # Step 2: Shuffle and Sort\n    grouped_data = shuffle_and_sort(mapped_data)\n    print(\"\\nSHUFFLE AND SORT OUTPUT:\")\n    for date, temperatures in sorted(grouped_data.items()):\n        print(date, temperatures)\n\n    # Step 3: Reduce\n    results = reducer(grouped_data)\n    print(\"\\nREDUCER OUTPUT (Date wise Maximum Temperature):\")\n    for date, temperature in sorted(results.items()):\n        print(f\"{date}: {temperature:.1f} C\")\n\n# --- bash ---\ncd \"Big Data\"\npython pract-3-B-BD.py", "full": "# Big Data Practical\n\n**Date:** 12/10/2026\n\n**Practical:** 3-B. Implement a MapReduce program to find Date wise Maximum Temperature from the Weather Dataset\n\n---\n\n## 1. Aim\n\nTo modify the Practical 3 MapReduce program to process the Weather Dataset and find the maximum temperature recorded per date (instead of per station).\n\n## 2. Objective\n\nUnderstand the three phases of MapReduce applied on the date key:\n\n1. **Mapper** — Emit `(date, temperature)` for each record.\n2. **Shuffle and Sort** — Group all temperatures by date.\n3. **Reducer** — Compute `max(temperatures)` per date.\n\n## 3. PIP Statement / Prerequisites\n\nNo external package is required. Only Python standard library modules are used.\n\n```bash\npython --version\n# Python 3.14.6 (verified on lab machine)\n\n# No pip install needed for this practical.\n# Used modules: csv, collections.defaultdict (both come with Python)\n```\n\n## 4. Dataset / File Setup\n\n**File:** `weather.csv`\n**Location:** Same folder as the Python program, i.e.:\n\n```\nBig Data/\n├── pract-3-B-BD.py\n└── weather.csv\n```\n\n**Dataset content (`weather.csv`):**\n\n```csv\nStation,Date,Temperature\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST03,2026-01-01,25\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,999\n```\n\n**Schema:**\n\n| Column | Description | Example |\n|---|---|---|\n| Station | Weather station ID | ST01, ST02, ST03 |\n| Date | Observation date (YYYY-MM-DD) | 2026-01-01 |\n| Temperature | Temperature in Celsius | 32, 28, 999 |\n\n> Note: The last row `ST01,2026-01-03,999` is an outlier / extreme value to test the max logic. The reducer correctly reports `2026-01-03: 999.0 C`.\n\n**Setup steps:**\n\n1. Create folder `Big Data`.\n2. Save dataset as `weather.csv` in that folder.\n3. Save program as `pract-3-B-BD.py` in the same folder.\n4. Run: `python pract-3-B-BD.py`\n\n**Modification from Practical 3:**\n\n| Practical 3 (`pract-3-BD.py`) | Practical 3-B (`pract-3-B-BD.py`) |\n|---|---|\n| Mapper emits `(station, temperature)` using `row[\"Station\"]` | Mapper emits `(date, temperature)` using `row[\"Date\"]` |\n| Shuffle groups by `station` | Shuffle groups by `date` |\n| Reducer finds max per `station` | Reducer finds max per `date` |\n\n## 5. Python Program\n\n**File Name:** `pract-3-B-BD.py`\n\n```python\n# Big Data Practical - 12/10/2026\n# Practical 3-B : MapReduce program to find Date wise Maximum Temperature\n\nimport csv\nfrom collections import defaultdict\n\n# Mapper: Emit (date, temperature)\ndef mapper(filename):\n    mapped_data = []\n\n    with open(filename, \"r\", newline=\"\") as file:\n        reader = csv.DictReader(file)\n\n        for row in reader:\n            date = row[\"Date\"]\n            temperature = float(row[\"Temperature\"])\n\n            mapped_data.append((date, temperature))\n\n    return mapped_data\n\n# Shuffle and Sort: Group values by date\ndef shuffle_and_sort(mapped_data):\n    grouped_data = defaultdict(list)\n\n    for date, temperature in mapped_data:\n        grouped_data[date].append(temperature)\n\n    return grouped_data\n\n# Reducer: Find maximum temperature per date\ndef reducer(grouped_data):\n    results = {}\n\n    for date, temperatures in grouped_data.items():\n        results[date] = max(temperatures)\n\n    return results\n\n# Main program\nif __name__ == \"__main__\":\n    filename = \"weather.csv\"\n\n    # Step 1: Map\n    mapped_data = mapper(filename)\n    print(\"MAPPER OUTPUT:\")\n    for item in mapped_data:\n        print(item)\n\n    # Step 2: Shuffle and Sort\n    grouped_data = shuffle_and_sort(mapped_data)\n    print(\"\\nSHUFFLE AND SORT OUTPUT:\")\n    for date, temperatures in sorted(grouped_data.items()):\n        print(date, temperatures)\n\n    # Step 3: Reduce\n    results = reducer(grouped_data)\n    print(\"\\nREDUCER OUTPUT (Date wise Maximum Temperature):\")\n    for date, temperature in sorted(results.items()):\n        print(f\"{date}: {temperature:.1f} C\")\n```\n\n**How to run:**\n\n```bash\ncd \"Big Data\"\npython pract-3-B-BD.py\n```\n\n## 6. Output\n\nReal output captured on Python 3.14.6:\n\n```text\nMAPPER OUTPUT:\n('2026-01-01', 32.0)\n('2026-01-01', 28.0)\n('2026-01-02', 35.0)\n('2026-01-02', 31.0)\n('2026-01-03', 30.0)\n('2026-01-01', 25.0)\n('2026-01-03', 29.0)\n('2026-01-02', 27.0)\n('2026-01-01', 32.0)\n('2026-01-01', 28.0)\n('2026-01-02', 35.0)\n('2026-01-02', 31.0)\n('2026-01-03', 30.0)\n('2026-01-03', 29.0)\n('2026-01-02', 27.0)\n('2026-01-01', 32.0)\n('2026-01-01', 28.0)\n('2026-01-02', 35.0)\n('2026-01-02', 31.0)\n('2026-01-03', 999.0)\n\nSHUFFLE AND SORT OUTPUT:\n2026-01-01 [32.0, 28.0, 25.0, 32.0, 28.0, 32.0, 28.0]\n2026-01-02 [35.0, 31.0, 27.0, 35.0, 31.0, 27.0, 35.0, 31.0]\n2026-01-03 [30.0, 29.0, 30.0, 29.0, 999.0]\n\nREDUCER OUTPUT (Date wise Maximum Temperature):\n2026-01-01: 32.0 C\n2026-01-02: 35.0 C\n2026-01-03: 999.0 C\n```\n\n## 7. Conclusion\n\nThe MapReduce logic was successfully modified to use date as the key. The mapper emitted 20 `(date, temperature)` pairs, the shuffle phase grouped them into 3 keys (2026-01-01, 2026-01-02, 2026-01-03), and the reducer correctly computed the maximum temperature per date. This demonstrates how the same MapReduce pattern can answer different analytical queries by simply changing the key."}, {"id": "3-C", "file": "pract-3-C-BD.md", "title": "3-C. Implement a MapReduce program to find Station wise Average Temperature and Station wise Minimum Temperature from the Weather Dataset", "text": "# Big Data Practical\n\n**Date:** 12/10/2026\n\n**Practical:** 3-C. Implement a MapReduce program to find Station wise Average Temperature and Station wise Minimum Temperature from the Weather Dataset\n\n---\n\n## 1. Aim\n\nTo modify the Practical 3 MapReduce program to process the Weather Dataset and find the average temperature and minimum temperature recorded per weather station.\n\n## 2. Objective\n\nUnderstand the three phases of MapReduce with an extended reducer:\n\n1. **Mapper** — Emit `(station, temperature)` for each record.\n2. **Shuffle and Sort** — Group all temperatures by station.\n3. **Reducer** — Compute `sum(temperatures)/count` (average) and `min(temperatures)` per station.\n\n## 7. Conclusion\n\nThe MapReduce logic was successfully extended to compute two aggregates in one reducer. The mapper emitted 20 `(station, temperature)` pairs, the shuffle phase grouped them into 3 keys (ST01, ST02, ST03), and the reducer correctly computed both average and minimum per station. This demonstrates how a single MapReduce job can produce multiple statistics per key.", "dataset": "Station,Date,Temperature\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST03,2026-01-01,25\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,999\n", "code": "# --- bash ---\npython --version\n# Python 3.14.6 (verified on lab machine)\n\n# No pip install needed for this practical.\n# Used modules: csv, collections.defaultdict (both come with Python)\n\n# --- python ---\n# Big Data Practical - 12/10/2026\n# Practical 3-C : MapReduce program to find Station wise Average Temperature & Station wise Minimum Temperature\n\nimport csv\nfrom collections import defaultdict\n\n\n# Mapper: Emit (station, temperature)\ndef mapper(filename):\n    mapped_data = []\n\n    with open(filename, \"r\", newline=\"\") as file:\n        reader = csv.DictReader(file)\n\n        for row in reader:\n            station = row[\"Station\"]\n            temperature = float(row[\"Temperature\"])\n\n            mapped_data.append((station, temperature))\n\n    return mapped_data\n\n\n# Shuffle and Sort: Group values by station\ndef shuffle_and_sort(mapped_data):\n    grouped_data = defaultdict(list)\n\n    for station, temperature in mapped_data:\n        grouped_data[station].append(temperature)\n\n    return grouped_data\n\n\n# Reducer: Find average and minimum temperature per station\ndef reducer(grouped_data):\n    results = {}\n\n    for station, temperatures in grouped_data.items():\n        avg_temp = sum(temperatures) / len(temperatures)\n        min_temp = min(temperatures)\n        results[station] = (avg_temp, min_temp)\n\n    return results\n\n\n# Main program\nif __name__ == \"__main__\":\n    filename = \"weather.csv\"\n\n    # Step 1: Map\n    mapped_data = mapper(filename)\n    print(\"MAPPER OUTPUT:\")\n    for item in mapped_data:\n        print(item)\n\n    # Step 2: Shuffle and Sort\n    grouped_data = shuffle_and_sort(mapped_data)\n    print(\"\\nSHUFFLE AND SORT OUTPUT:\")\n    for station, temperatures in sorted(grouped_data.items()):\n        print(station, temperatures)\n\n    # Step 3: Reduce\n    results = reducer(grouped_data)\n    print(\"\\nREDUCER OUTPUT (Station wise Average and Minimum Temperature):\")\n    for station, (avg_temp, min_temp) in sorted(results.items()):\n        print(f\"{station}: Average = {avg_temp:.1f} C, Minimum = {min_temp:.1f} C\")\n\n# --- bash ---\ncd \"Big Data\"\npython pract-3-C-BD.py", "full": "# Big Data Practical\n\n**Date:** 12/10/2026\n\n**Practical:** 3-C. Implement a MapReduce program to find Station wise Average Temperature and Station wise Minimum Temperature from the Weather Dataset\n\n---\n\n## 1. Aim\n\nTo modify the Practical 3 MapReduce program to process the Weather Dataset and find the average temperature and minimum temperature recorded per weather station.\n\n## 2. Objective\n\nUnderstand the three phases of MapReduce with an extended reducer:\n\n1. **Mapper** — Emit `(station, temperature)` for each record.\n2. **Shuffle and Sort** — Group all temperatures by station.\n3. **Reducer** — Compute `sum(temperatures)/count` (average) and `min(temperatures)` per station.\n\n## 3. PIP Statement / Prerequisites\n\nNo external package is required. Only Python standard library modules are used.\n\n```bash\npython --version\n# Python 3.14.6 (verified on lab machine)\n\n# No pip install needed for this practical.\n# Used modules: csv, collections.defaultdict (both come with Python)\n```\n\n## 4. Dataset / File Setup\n\n**File:** `weather.csv`\n**Location:** Same folder as the Python program, i.e.:\n\n```\nBig Data/\n├── pract-3-C-BD.py\n└── weather.csv\n```\n\n**Dataset content (`weather.csv`):**\n\n```csv\nStation,Date,Temperature\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST03,2026-01-01,25\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,30\nST02,2026-01-03,29\nST03,2026-01-02,27\nST01,2026-01-01,32\nST02,2026-01-01,28\nST01,2026-01-02,35\nST02,2026-01-02,31\nST01,2026-01-03,999\n```\n\n**Schema:**\n\n| Column | Description | Example |\n|---|---|---|\n| Station | Weather station ID | ST01, ST02, ST03 |\n| Date | Observation date (YYYY-MM-DD) | 2026-01-01 |\n| Temperature | Temperature in Celsius | 32, 28, 999 |\n\n> Note: The outlier `ST01,2026-01-03,999` raises the ST01 average to 140.0 C but does not affect the minimum (30.0 C), which shows why both average and minimum are useful together.\n\n**Setup steps:**\n\n1. Create folder `Big Data`.\n2. Save dataset as `weather.csv` in that folder.\n3. Save program as `pract-3-C-BD.py` in the same folder.\n4. Run: `python pract-3-C-BD.py`\n\n**Modification from Practical 3:**\n\n| Practical 3 (`pract-3-BD.py`) | Practical 3-C (`pract-3-C-BD.py`) |\n|---|---|\n| Reducer computes `max(temperatures)` per station | Reducer computes `sum/len` (average) and `min(temperatures)` per station |\n| Result is single value `results[station] = max(...)` | Result is tuple `results[station] = (avg_temp, min_temp)` |\n| Output prints `Maximum Temperature` | Output prints `Average` and `Minimum` together |\n\n## 5. Python Program\n\n**File Name:** `pract-3-C-BD.py`\n\n```python\n# Big Data Practical - 12/10/2026\n# Practical 3-C : MapReduce program to find Station wise Average Temperature & Station wise Minimum Temperature\n\nimport csv\nfrom collections import defaultdict\n\n# Mapper: Emit (station, temperature)\ndef mapper(filename):\n    mapped_data = []\n\n    with open(filename, \"r\", newline=\"\") as file:\n        reader = csv.DictReader(file)\n\n        for row in reader:\n            station = row[\"Station\"]\n            temperature = float(row[\"Temperature\"])\n\n            mapped_data.append((station, temperature))\n\n    return mapped_data\n\n# Shuffle and Sort: Group values by station\ndef shuffle_and_sort(mapped_data):\n    grouped_data = defaultdict(list)\n\n    for station, temperature in mapped_data:\n        grouped_data[station].append(temperature)\n\n    return grouped_data\n\n# Reducer: Find average and minimum temperature per station\ndef reducer(grouped_data):\n    results = {}\n\n    for station, temperatures in grouped_data.items():\n        avg_temp = sum(temperatures) / len(temperatures)\n        min_temp = min(temperatures)\n        results[station] = (avg_temp, min_temp)\n\n    return results\n\n# Main program\nif __name__ == \"__main__\":\n    filename = \"weather.csv\"\n\n    # Step 1: Map\n    mapped_data = mapper(filename)\n    print(\"MAPPER OUTPUT:\")\n    for item in mapped_data:\n        print(item)\n\n    # Step 2: Shuffle and Sort\n    grouped_data = shuffle_and_sort(mapped_data)\n    print(\"\\nSHUFFLE AND SORT OUTPUT:\")\n    for station, temperatures in sorted(grouped_data.items()):\n        print(station, temperatures)\n\n    # Step 3: Reduce\n    results = reducer(grouped_data)\n    print(\"\\nREDUCER OUTPUT (Station wise Average and Minimum Temperature):\")\n    for station, (avg_temp, min_temp) in sorted(results.items()):\n        print(f\"{station}: Average = {avg_temp:.1f} C, Minimum = {min_temp:.1f} C\")\n```\n\n**How to run:**\n\n```bash\ncd \"Big Data\"\npython pract-3-C-BD.py\n```\n\n## 6. Output\n\nReal output captured on Python 3.14.6:\n\n```text\nMAPPER OUTPUT:\n('ST01', 32.0)\n('ST02', 28.0)\n('ST01', 35.0)\n('ST02', 31.0)\n('ST01', 30.0)\n('ST03', 25.0)\n('ST02', 29.0)\n('ST03', 27.0)\n('ST01', 32.0)\n('ST02', 28.0)\n('ST01', 35.0)\n('ST02', 31.0)\n('ST01', 30.0)\n('ST02', 29.0)\n('ST03', 27.0)\n('ST01', 32.0)\n('ST02', 28.0)\n('ST01', 35.0)\n('ST02', 31.0)\n('ST01', 999.0)\n\nSHUFFLE AND SORT OUTPUT:\nST01 [32.0, 35.0, 30.0, 32.0, 35.0, 30.0, 32.0, 35.0, 999.0]\nST02 [28.0, 31.0, 29.0, 28.0, 31.0, 29.0, 28.0, 31.0]\nST03 [25.0, 27.0, 27.0]\n\nREDUCER OUTPUT (Station wise Average and Minimum Temperature):\nST01: Average = 140.0 C, Minimum = 30.0 C\nST02: Average = 29.4 C, Minimum = 28.0 C\nST03: Average = 26.3 C, Minimum = 25.0 C\n```\n\nCalculation check:\n\n- ST01: (32+35+30+32+35+30+32+35+999)/9 = 1260/9 = 140.0, min = 30.0\n- ST02: (28+31+29+28+31+29+28+31)/8 = 235/8 = 29.4, min = 28.0\n- ST03: (25+27+27)/3 = 79/3 = 26.3, min = 25.0\n\n## 7. Conclusion\n\nThe MapReduce logic was successfully extended to compute two aggregates in one reducer. The mapper emitted 20 `(station, temperature)` pairs, the shuffle phase grouped them into 3 keys (ST01, ST02, ST03), and the reducer correctly computed both average and minimum per station. This demonstrates how a single MapReduce job can produce multiple statistics per key."}, {"id": "4", "file": "pract-4-BD.md", "title": "4. Implement an application that stores Big Data in MongoDB and Manipulate it using Python", "text": "# Big Data Practical\n\n**Date:** 28/09/2026\n\n**Practical:** 4. Implement an application that stores Big Data in MongoDB and Manipulate it using Python\n\n---\n\n## 1. Aim\n\nTo store Big Data (10,000 student records) in MongoDB and perform CRUD operations, queries, sorting, counting and aggregation using Python (`pymongo`).\n\n## 2. Objective\n\n1. Connect Python to MongoDB.\n2. Bulk insert 10,000 documents.\n3. Query with filters (`marks > 80`, `city == Mumbai`).\n4. Update (`update_one`, `update_many`), Sort, Count.\n5. Aggregate (`$avg`, `$max`, `$min`).\n6. Delete and close connection.\n\n## 7. Conclusion\n\nMongoDB successfully stored 10,000 documents as Big Data. All manipulation operations — filter queries, single and bulk updates, sorting, counting, aggregation (`avg/max/min`) and delete — were executed from Python via `pymongo`. This demonstrates how Python + MongoDB (NoSQL) is used for scalable Big Data storage and analysis.", "dataset": null, "code": "# --- bash ---\npip install pymongo\n\n# --- bash ---\npython -c \"import pymongo; print(pymongo.version)\"\n# 4.18.2\n\npython -c \"from pymongo import MongoClient; print(MongoClient('mongodb://localhost:27017/', serverSelectionTimeoutMS=5000).server_info()['version'])\"\n# 9.0.2\n\n# --- python ---\nfrom pymongo import MongoClient\nclient = MongoClient(\"mongodb://localhost:27017/\")\nclient[\"BigDataDB\"][\"students\"].drop()\n\n# --- python ---\n# Big Data Practical - 28/09/2026\n# Practical 4 : Implement an application that stores Big Data in MongoDB and Manipulate it using Python\n\n# !pip install pymongo\n\nfrom pymongo import MongoClient\n\n# -------------------------------------------------\n# 1. Connect to MongoDB\n# -------------------------------------------------\nclient = MongoClient(\"mongodb://localhost:27017/\")\n\n# Create/select database\ndb = client[\"BigDataDB\"]\n\n# Create/select collection\ncollection = db[\"students\"]\n\nprint(\"Connected to MongoDB successfully!\")\n\n\n# -------------------------------------------------\n# 2. Insert Big Data\n# -------------------------------------------------\nstudents = []\n\n# Generate 10,000 student records\nfor i in range(1, 10001):\n    student = {\n        \"student_id\": i,\n        \"name\": \"Student_\" + str(i),\n        \"age\": 18 + (i % 5),\n        \"course\": \"Data Science\",\n        \"marks\": 40 + (i % 61),\n        \"city\": \"Mumbai\" if i % 2 == 0 else \"Pune\"\n    }\n\n    students.append(student)\n\n# Insert many records at once\ncollection.insert_many(students)\n\nprint(\"10,000 student records inserted.\")\n\n\n# -------------------------------------------------\n# 3. Display Records\n# -------------------------------------------------\nprint(\"\\nFirst 10000 records:\")\n\nfor student in collection.find().limit(10000):\n    print(student)\n\n\n# -------------------------------------------------\n# 4. Find Students with Marks > 80\n# -------------------------------------------------\nprint(\"\\nStudents having marks greater than 80:\")\n\nfor student in collection.find({\"marks\": {\"$gt\": 80}}).limit(10):\n    print(student)\n\n\n# -------------------------------------------------\n# 5. Find Students from Mumbai\n# -------------------------------------------------\nprint(\"\\nStudents from Mumbai:\")\n\nfor student in collection.find({\"city\": \"Mumbai\"}).limit(5):\n    print(student)\n\n\n# -------------------------------------------------\n# 6. Update a Record\n# -------------------------------------------------\ncollection.update_one(\n    {\"student_id\": 1},\n    {\"$set\": {\"marks\": 95}}\n)\n\nprint(\"\\nStudent 1 updated successfully.\")\n\n\n# -------------------------------------------------\n# 7. Increase Marks of Multiple Students\n# -------------------------------------------------\ncollection.update_many(\n    {\"marks\": {\"$lt\": 50}},\n    {\"$inc\": {\"marks\": 5}}\n)\n\nprint(\"Marks increased for students having marks below 50.\")\n\n\n# -------------------------------------------------\n# 8. Sort Students by Marks\n# -------------------------------------------------\nprint(\"\\nTop 10 students:\")\n\nfor student in collection.find().sort(\"marks\", -1).limit(10):\n    print(student)\n\n\n# -------------------------------------------------\n# 9. Count Records\n# -------------------------------------------------\ntotal_students = collection.count_documents({})\n\nprint(\"\\nTotal students:\", total_students)\n\n\n# -------------------------------------------------\n# 10. Aggregation\n# Calculate average marks\n# -------------------------------------------------\nresult = collection.aggregate([\n    {\n        \"$group\": {\n            \"_id\": None,\n            \"average_marks\": {\"$avg\": \"$marks\"},\n            \"maximum_marks\": {\"$max\": \"$marks\"},\n            \"minimum_marks\": {\"$min\": \"$marks\"}\n        }\n    }\n])\n\nprint(\"\\nMarks Statistics:\")\n\nfor data in result:\n    print(data)\n\n\n# -------------------------------------------------\n# 11. Delete One Record\n# -------------------------------------------------\ncollection.delete_one({\"student_id\": 10000})\n\nprint(\"\\nStudent 10000 deleted.\")\n\n\n# -------------------------------------------------\n# 12. Close Connection\n# -------------------------------------------------\nclient.close()\n\nprint(\"\\nMongoDB connection closed.\")\n\n# --- bash ---\ncd \"Big Data\"\npip install pymongo\npython pract-4-BD.py", "full": "# Big Data Practical\n\n**Date:** 28/09/2026\n\n**Practical:** 4. Implement an application that stores Big Data in MongoDB and Manipulate it using Python\n\n---\n\n## 1. Aim\n\nTo store Big Data (10,000 student records) in MongoDB and perform CRUD operations, queries, sorting, counting and aggregation using Python (`pymongo`).\n\n## 2. Objective\n\n1. Connect Python to MongoDB.\n2. Bulk insert 10,000 documents.\n3. Query with filters (`marks > 80`, `city == Mumbai`).\n4. Update (`update_one`, `update_many`), Sort, Count.\n5. Aggregate (`$avg`, `$max`, `$min`).\n6. Delete and close connection.\n\n## 3. PIP Statement / Prerequisites\n\n**Required software:**\n\n- Python 3.x (verified: Python 3.14.6)\n- MongoDB Community Server 9.0.2 running on `localhost:27017`\n- Python driver `pymongo`\n\n**Installation:**\n\n```bash\npip install pymongo\n```\n\n**Verified on lab machine:**\n\n```text\nName: pymongo\nVersion: 4.18.2\nLocation: Python314\\site-packages\nRequires: dnspython\n\nMongoDB Server version: 9.0.2\nService: MongoDB Status Running\nConnection string: mongodb://localhost:27017/\n```\n\n**Verify setup before running:**\n\n```bash\npython -c \"import pymongo; print(pymongo.version)\"\n# 4.18.2\n\npython -c \"from pymongo import MongoClient; print(MongoClient('mongodb://localhost:27017/', serverSelectionTimeoutMS=5000).server_info()['version'])\"\n# 9.0.2\n```\n\n> Ensure `mongod` is running. On Windows check `Services -> MongoDB` or run `net start MongoDB`. MongoDB Compass can be used to visually verify `BigDataDB.students`.\n\n## 4. Dataset / File Setup\n\nNo CSV file is needed. The dataset is **generated inside the program**.\n\n**Database:** `BigDataDB`\n**Collection:** `students`\n\n**Document schema (10,000 records, `student_id` 1 to 10000):**\n\n| Field | Type | Generation logic | Example |\n|---|---|---|---|\n| student_id | int | `i` (1..10000) | 1 |\n| name | string | `\"Student_\" + str(i)` | Student_1 |\n| age | int | `18 + (i % 5)` → 18-22 | 19 |\n| course | string | Fixed `\"Data Science\"` | Data Science |\n| marks | int | `40 + (i % 61)` → 40-100 | 41 |\n| city | string | `\"Mumbai\" if i%2==0 else \"Pune\"` | Pune |\n| _id | ObjectId | Auto-generated by MongoDB | ObjectId('...') |\n\n**File setup:**\n\n```\nBig Data/\n└── pract-4-BD.py\n```\n\n**Pre-run cleanup (to avoid duplicates on re-run):**\n\n```python\nfrom pymongo import MongoClient\nclient = MongoClient(\"mongodb://localhost:27017/\")\nclient[\"BigDataDB\"][\"students\"].drop()\n```\n\nOperations performed by the program:\n\n1. `insert_many(students)` — 10,000 docs\n2. `find().limit(10000)` — display\n3. `find({\"marks\": {\"$gt\": 80}}).limit(10)`\n4. `find({\"city\": \"Mumbai\"}).limit(5)`\n5. `update_one({\"student_id\": 1}, {\"$set\": {\"marks\": 95}})`\n6. `update_many({\"marks\": {\"$lt\": 50}}, {\"$inc\": {\"marks\": 5}})`\n7. `find().sort(\"marks\", -1).limit(10)`\n8. `count_documents({})`\n9. `aggregate([{\"$group\": {\"_id\": None, \"average_marks\": {\"$avg\": \"$marks\"}, \"maximum_marks\": {\"$max\": \"$marks\"}, \"minimum_marks\": {\"$min\": \"$marks\"}}}}])`\n10. `delete_one({\"student_id\": 10000})`\n\n## 5. Python Program\n\n**File Name:** `pract-4-BD.py`\n\n```python\n# Big Data Practical - 28/09/2026\n# Practical 4 : Implement an application that stores Big Data in MongoDB and Manipulate it using Python\n\n# !pip install pymongo\n\nfrom pymongo import MongoClient\n\n# -------------------------------------------------\n# 1. Connect to MongoDB\n# -------------------------------------------------\nclient = MongoClient(\"mongodb://localhost:27017/\")\n\n# Create/select database\ndb = client[\"BigDataDB\"]\n\n# Create/select collection\ncollection = db[\"students\"]\n\nprint(\"Connected to MongoDB successfully!\")\n\n# -------------------------------------------------\n# 2. Insert Big Data\n# -------------------------------------------------\nstudents = []\n\n# Generate 10,000 student records\nfor i in range(1, 10001):\n    student = {\n        \"student_id\": i,\n        \"name\": \"Student_\" + str(i),\n        \"age\": 18 + (i % 5),\n        \"course\": \"Data Science\",\n        \"marks\": 40 + (i % 61),\n        \"city\": \"Mumbai\" if i % 2 == 0 else \"Pune\"\n    }\n\n    students.append(student)\n\n# Insert many records at once\ncollection.insert_many(students)\n\nprint(\"10,000 student records inserted.\")\n\n# -------------------------------------------------\n# 3. Display Records\n# -------------------------------------------------\nprint(\"\\nFirst 10000 records:\")\n\nfor student in collection.find().limit(10000):\n    print(student)\n\n# -------------------------------------------------\n# 4. Find Students with Marks > 80\n# -------------------------------------------------\nprint(\"\\nStudents having marks greater than 80:\")\n\nfor student in collection.find({\"marks\": {\"$gt\": 80}}).limit(10):\n    print(student)\n\n# -------------------------------------------------\n# 5. Find Students from Mumbai\n# -------------------------------------------------\nprint(\"\\nStudents from Mumbai:\")\n\nfor student in collection.find({\"city\": \"Mumbai\"}).limit(5):\n    print(student)\n\n# -------------------------------------------------\n# 6. Update a Record\n# -------------------------------------------------\ncollection.update_one(\n    {\"student_id\": 1},\n    {\"$set\": {\"marks\": 95}}\n)\n\nprint(\"\\nStudent 1 updated successfully.\")\n\n# -------------------------------------------------\n# 7. Increase Marks of Multiple Students\n# -------------------------------------------------\ncollection.update_many(\n    {\"marks\": {\"$lt\": 50}},\n    {\"$inc\": {\"marks\": 5}}\n)\n\nprint(\"Marks increased for students having marks below 50.\")\n\n# -------------------------------------------------\n# 8. Sort Students by Marks\n# -------------------------------------------------\nprint(\"\\nTop 10 students:\")\n\nfor student in collection.find().sort(\"marks\", -1).limit(10):\n    print(student)\n\n# -------------------------------------------------\n# 9. Count Records\n# -------------------------------------------------\ntotal_students = collection.count_documents({})\n\nprint(\"\\nTotal students:\", total_students)\n\n# -------------------------------------------------\n# 10. Aggregation\n# Calculate average marks\n# -------------------------------------------------\nresult = collection.aggregate([\n    {\n        \"$group\": {\n            \"_id\": None,\n            \"average_marks\": {\"$avg\": \"$marks\"},\n            \"maximum_marks\": {\"$max\": \"$marks\"},\n            \"minimum_marks\": {\"$min\": \"$marks\"}\n        }\n    }\n])\n\nprint(\"\\nMarks Statistics:\")\n\nfor data in result:\n    print(data)\n\n# -------------------------------------------------\n# 11. Delete One Record\n# -------------------------------------------------\ncollection.delete_one({\"student_id\": 10000})\n\nprint(\"\\nStudent 10000 deleted.\")\n\n# -------------------------------------------------\n# 12. Close Connection\n# -------------------------------------------------\nclient.close()\n\nprint(\"\\nMongoDB connection closed.\")\n```\n\n**How to run:**\n\n```bash\ncd \"Big Data\"\npip install pymongo\npython pract-4-BD.py\n```\n\n## 6. Output\n\nReal output captured with MongoDB 9.0.2, pymongo 4.18.2, Python 3.14.6.\n\n> `_id` ObjectId values differ on every run — shown here as actual captured values. The `First 10000 records` section prints all 10000 lines; only first 3 + last 3 are shown below to keep the journal readable. Full output was verified in `pract4_full_output.txt` during execution.\n\n```text\nConnected to MongoDB successfully!\n10,000 student records inserted.\n\nFirst 10000 records:\n{'_id': ObjectId('6acc56f0a38923a6d470a0bb'), 'student_id': 1, 'name': 'Student_1', 'age': 19, 'course': 'Data Science', 'marks': 41, 'city': 'Pune'}\n{'_id': ObjectId('6acc56f0a38923a6d470a0bc'), 'student_id': 2, 'name': 'Student_2', 'age': 20, 'course': 'Data Science', 'marks': 42, 'city': 'Mumbai'}\n{'_id': ObjectId('6acc56f0a38923a6d470a0bd'), 'student_id': 3, 'name': 'Student_3', 'age': 21, 'course': 'Data Science', 'marks': 43, 'city': 'Pune'}\n... [output truncated — total 10000 records printed] ...\n{'_id': ObjectId('6acc56f0a38923a6d470c7c8'), 'student_id': 9998, 'name': 'Student_9998', 'age': 21, 'course': 'Data Science', 'marks': 95, 'city': 'Mumbai'}\n{'_id': ObjectId('6acc56f0a38923a6d470c7c9'), 'student_id': 9999, 'name': 'Student_9999', 'age': 22, 'course': 'Data Science', 'marks': 96, 'city': 'Pune'}\n{'_id': ObjectId('6acc56f0a38923a6d470c7ca'), 'student_id': 10000, 'name': 'Student_10000', 'age': 18, 'course': 'Data Science', 'marks': 97, 'city': 'Mumbai'}\n\nStudents having marks greater than 80:\n{'_id': ObjectId('...'), 'student_id': 41, 'name': 'Student_41', 'age': 19, 'course': 'Data Science', 'marks': 81, 'city': 'Pune'}\n{'_id': ObjectId('...'), 'student_id': 42, 'name': 'Student_42', 'age': 20, 'course': 'Data Science', 'marks': 82, 'city': 'Mumbai'}\n{'_id': ObjectId('...'), 'student_id': 43, 'name': 'Student_43', 'age': 21, 'course': 'Data Science', 'marks': 83, 'city': 'Pune'}\n{'_id': ObjectId('...'), 'student_id': 44, 'name': 'Student_44', 'age': 22, 'course': 'Data Science', 'marks': 84, 'city': 'Mumbai'}\n{'_id': ObjectId('...'), 'student_id': 45, 'name': 'Student_45', 'age': 18, 'course': 'Data Science', 'marks': 85, 'city': 'Pune'}\n{'_id': ObjectId('...'), 'student_id': 46, 'name': 'Student_46', 'age': 1 function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.add('hidden'),1800);
}

async function copyStr(s, label){
  if(!s){toast('nothing to copy');return;}
  try{ await navigator.clipboard.writeText(s); }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=s; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');}catch(_){}
    ta.remove();
  }
  toast('\u2713 copied ' + label);
}
function copyField(i, field){
  const p=PRACTICALS[i];
  const labels={text:'TEXT '+p.id, dataset:'DATASET '+p.id, code:'CODE '+p.id, full:'FULL '+p.file};
  copyStr(p[field]||'', labels[field]);
}

function btnHTML(i, field, label, color){
  const p=PRACTICALS[i];
  const dis = (field==='dataset' && !p.dataset);
  const base='btn text-[10px] uppercase tracking-wide border rounded px-1.5 py-0.5 ';
  if(dis) return `<button disabled title="no dataset in this practical" class="${base}border-[#2d2d2d] text-gray-600 opacity-40 cursor-not-allowed">${label}</button>`;
  return `<button onclick="copyField(${i},'${field}')" title="copy ${field} — ${esc(p.file)}" class="${base}${color}">${label}</button>`;
}

function renderIndex(){
  const q=(document.getElementById('filter').value||'').toLowerCase();
  const box=document.getElementById('index');
  let html='';
  PRACTICALS.forEach((p,i)=>{
    if(q && !(p.id+' '+p.title+' '+p.file).toLowerCase().includes(q)) return;
    html+=`<div class="flex flex-col md:flex-row md:items-center gap-1.5 md:gap-3 px-2.5 py-2 border-b border-[#1e1e1e] last:border-0 hover:bg-[#111111]">
      <div class="flex items-start gap-2 min-w-0 flex-1">
        <span class="text-[#4ec9b0] text-xs font-bold whitespace-nowrap">[${esc(p.id)}]</span>
        <a href="#sec-${i}" class="text-[12px] sm:text-[13px] text-gray-200 leading-snug hover:text-[#4ec9b0] hover:underline break-words">${esc(p.title)} <span class="text-gray-600 text-[10px]">${esc(p.file)}</span></a>
      </div>
      <div class="flex flex-wrap gap-1.5 md:justify-end shrink-0 pl-7 md:pl-0">
        ${btnHTML(i,'text','txt','border-[#569cd6]/60 text-[#9cdcfe] hover:bg-[#569cd6]/20')}
        ${btnHTML(i,'dataset','data','border-[#d7ba7d]/60 text-[#d7ba7d] hover:bg-[#d7ba7d]/20')}
        ${btnHTML(i,'code','code','border-[#4ec9b0]/60 text-[#4ec9b0] hover:bg-[#4ec9b0]/20')}
        ${btnHTML(i,'full','.md','border-[#c586c0]/60 text-[#c586c0] hover:bg-[#c586c0]/20')}
      </div>
    </div>`;
  });
  box.innerHTML = html || '<div class="p-3 text-xs text-gray-500">no match. clear filter.</div>';
}

function renderSections(){
  const q=(document.getElementById('filter').value||'').toLowerCase();
  const box=document.getElementById('sections');
  box.innerHTML = PRACTICALS.map((p,i)=>{
    if(q && !(p.id+' '+p.title+' '+p.file).toLowerCase().includes(q)) return '';
    let rendered='';
    try{ rendered = marked.parse(p.full); }catch(e){ rendered='<p>render error</p>'; }
    return `<section id="sec-${i}" class="border border-[#2d2d2d] rounded-md overflow-hidden bg-[#0c0c0c]">
      <button onclick="document.getElementById('body-${i}').classList.toggle('hidden')" class="w-full text-left px-2.5 py-2 bg-[#161616] hover:bg-[#1b1b1b] flex flex-col sm:flex-row sm:items-center gap-1.5">
        <span class="text-[#c586c0] text-xs">&gt; cat</span>
        <span class="text-[#4ec9b0] text-xs font-bold">[${esc(p.id)}]</span>
        <span class="text-xs text-gray-200 break-words">${esc(p.title)}</span>
        <span class="sm:ml-auto flex gap-1.5" onclick="event.stopPropagation()">
          ${btnHTML(i,'text','txt','border-[#569cd6]/60 text-[#9cdcfe]')}
          ${btnHTML(i,'dataset','data','border-[#d7ba7d]/60 text-[#d7ba7d]')}
          ${btnHTML(i,'code','code','border-[#4ec9b0]/60 text-[#4ec9b0]')}
          ${btnHTML(i,'full','.md','border-[#c586c0]/60 text-[#c586c0]')}
        </span>
      </button>
      <div id="body-${i}">
        <div class="flex gap-1.5 px-2.5 py-2 border-t border-[#2d2d2d] text-[11px]">
          <button id="tabR-${i}" onclick="setView(${i},'rendered')" class="btn px-2 py-0.5 rounded bg-[#4ec9b0]/20 text-[#4ec9b0] border border-[#4ec9b0]/50">rendered</button>
          <button id="tabW-${i}" onclick="setView(${i},'raw')" class="btn px-2 py-0.5 rounded text-gray-400 border border-[#2d2d2d]">raw</button>
          <span class="ml-auto text-gray-600 hidden sm:inline">${esc(p.file)}</span>
        </div>
        <div id="rendered-${i}" class="md-render px-3 pb-3 term-scroll overflow-x-auto">${rendered}</div>
        <div class="px-2.5 pb-1 text-[10px] text-gray-600">--- raw .md (exact file, copy with .md button) ---</div>
        <pre id="raw-${i}" class="hidden term-scroll mx-2.5 mb-3 bg-black border border-[#2d2d2d] rounded-md p-3 text-[11px] leading-relaxed text-gray-300 overflow-x-auto whitespace-pre-wrap break-words max-h-[500px] overflow-y-auto"><code>${esc(p.full)}</code></pre>
      </div>
    </section>`;
  }).join('');
  enhanceCodeBlocks();
}

function copyBlock(btn){
  const wrap = btn.closest('.code-wrap');
  const code = wrap ? wrap.querySelector('pre code') : null;
  const txt = code ? code.innerText : '';
  copyStr(txt, 'code block');
  btn.textContent = 'copied!';
  setTimeout(()=>{ btn.textContent = 'copy'; }, 1200);
}

function enhanceCodeBlocks(){
  document.querySelectorAll('.md-render pre').forEach((pre)=>{
    if(pre.parentElement && pre.parentElement.classList.contains('code-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const b = document.createElement('button');
    b.className = 'copy-block-btn btn';
    b.textContent = 'copy';
    b.setAttribute('onclick', 'copyBlock(this)');
    wrap.appendChild(b);
  });
}

function setView(i, mode){
  const r=document.getElementById('rendered-'+i), w=document.getElementById('raw-'+i);
  const tr=document.getElementById('tabR-'+i), tw=document.getElementById('tabW-'+i);
  const on='btn px-2 py-0.5 rounded bg-[#4ec9b0]/20 text-[#4ec9b0] border border-[#4ec9b0]/50';
  const off='btn px-2 py-0.5 rounded text-gray-400 border border-[#2d2d2d]';
  if(mode==='raw'){w.classList.remove('hidden');r.classList.add('hidden');tw.className=on;tr.className=off;}
  else{w.classList.add('hidden');r.classList.remove('hidden');tr.className=on;tw.className=off;}
}
function toggleAll(open){
  PRACTICALS.forEach((_,i)=>{
    const b=document.getElementById('body-'+i);
    if(b) b.classList.toggle('hidden', !open);
  });
}
document.getElementById('filter').addEventListener('input', ()=>{renderIndex();renderSections();});
renderIndex(); renderSections();
